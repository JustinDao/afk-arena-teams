<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AFK Arena Batch Lineup Reviewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f131a;
      --panel: #171d27;
      --border: #2a3342;
      --text: #e7ecf4;
      --muted: #93a1b8;
      --accent: #6aa6ff;
      --sus-bg: rgba(245, 158, 11, 0.16);
      --sus-border: rgba(245, 158, 11, 0.55);
      --sus-text: #fbbf24;
      --ok: #22c55e;
      --bad: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 19, 26, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    select, input, button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
    }
    button {
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { border-color: var(--accent); }
    button.primary {
      background: #1e3a66;
      border-color: var(--accent);
    }
    .stats {
      font-size: 13px;
      color: var(--muted);
    }
    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 18px 20px 60px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: grid;
      grid-template-columns: minmax(320px, 1.15fr) minmax(320px, 1fr);
      gap: 18px;
      align-items: start;
    }
    .card.status-real { border-color: rgba(34, 197, 94, 0.45); }
    .card.status-false { border-color: rgba(239, 68, 68, 0.55); }
    @media (max-width: 900px) {
      .card { grid-template-columns: 1fr; }
    }
    .crop-wrap {
      background: #0b0e14;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 120px;
    }
    .crop-wrap img {
      max-width: 100%;
      max-height: 460px;
      height: auto;
      border-radius: 4px;
      display: block;
    }
    .meta {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .meta-top {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }
    .pill {
      background: #222b3a;
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 999px;
      color: var(--text);
      font-weight: 600;
    }
    .title-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
    }
    .title-link:hover { text-decoration: underline; }
    .hero-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hero-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 8px;
      background: #121720;
      border: 1px solid var(--border);
      font-size: 13px;
    }
    .hero-row.sus {
      background: var(--sus-bg);
      border-color: var(--sus-border);
    }
    .hero-name {
      font-weight: 700;
    }
    .hero-row.sus .hero-name {
      color: var(--sus-text);
    }
    .hero-debug {
      font-size: 11px;
      color: var(--muted);
      text-align: right;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 4px;
    }
    .btn-real.active {
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--ok);
      color: #86efac;
    }
    .btn-false.active {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--bad);
      color: #fca5a5;
    }
    .note-input {
      flex: 1;
      min-width: 180px;
    }
  </style>
</head>
<body>
  <header>
    <div class="controls">
      <select id="heroFilter"><option value="">All suspicious heroes</option></select>
      <select id="authorFilter"><option value="">All authors</option></select>
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="unreviewed">Unreviewed</option>
        <option value="real">Confirmed Real</option>
        <option value="false">False Positive</option>
      </select>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;">
        <input id="reprocessedOnly" type="checkbox" checked />
        Only newly re-recognized
      </label>
      <input id="searchInput" type="search" placeholder="Search title / hero..." />
    </div>
    <div class="controls">
      <span id="stats" class="stats">Loading...</span>
      <button id="copyBtn" class="primary">Copy Review JSON</button>
      <button id="resetBtn">Reset Marks</button>
    </div>
  </header>
  <main id="list"></main>

  <script>
    const STORAGE_KEY = 'afk_sample_review_v5';
    let ITEMS = [];
    let reviews = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

    function saveReviews() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(reviews));
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function populateFilters() {
      const heroCounts = new Map();
      const authors = new Set();
      for (const item of ITEMS) {
        authors.add(item.author);
        for (const h of new Set(item.sus_heroes)) {
          heroCounts.set(h, (heroCounts.get(h) || 0) + 1);
        }
      }
      const heroSelect = document.getElementById('heroFilter');
      [...heroCounts.entries()]
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
        .forEach(([name, count]) => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = `${name} (${count} teams)`;
          heroSelect.appendChild(opt);
        });
      const authorSelect = document.getElementById('authorFilter');
      [...authors].sort().forEach((a) => {
        const opt = document.createElement('option');
        opt.value = a;
        opt.textContent = a;
        authorSelect.appendChild(opt);
      });
    }

    function render() {
      const heroVal = document.getElementById('heroFilter').value;
      const authorVal = document.getElementById('authorFilter').value;
      const statusVal = document.getElementById('statusFilter').value;
      const reprocessedOnly = document.getElementById('reprocessedOnly').checked;
      const q = document.getElementById('searchInput').value.trim().toLowerCase();

      const filtered = ITEMS.filter((item) => {
        if (reprocessedOnly && !item.reprocessed) return false;
        if (heroVal && !item.sus_heroes.includes(heroVal)) return false;
        if (authorVal && item.author !== authorVal) return false;
        const rev = reviews[item.id]?.status || 'unreviewed';
        if (statusVal && rev !== statusVal) return false;
        if (q) {
          const hay = `${item.title} ${item.author} ${item.target || ''} ${item.heroes.map(h => h.name).join(' ')}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const realCount = Object.values(reviews).filter(r => r.status === 'real').length;
      const falseCount = Object.values(reviews).filter(r => r.status === 'false').length;
      document.getElementById('stats').textContent =
        `Showing ${filtered.length} / ${ITEMS.length} teams · Real: ${realCount} · False Positive: ${falseCount}`;

      const list = document.getElementById('list');
      list.innerHTML = '';

      for (const item of filtered) {
        const rev = reviews[item.id] || {};
        const card = document.createElement('section');
        card.className = `card ${rev.status ? 'status-' + rev.status : ''}`;
        card.innerHTML = `
          <div class="crop-wrap">
            <img src="${escapeHtml(item.crop)}" loading="lazy" alt="${escapeHtml(item.title)}" />
          </div>
          <div class="meta">
            <div class="meta-top">
              <span class="pill">${escapeHtml(item.author)}</span>
              <span class="pill">${escapeHtml(item.mode || '')}${item.target ? ' · ' + escapeHtml(item.target) : ''}</span>
              <span class="pill">${escapeHtml(item.set_label)} · Team ${item.team_num}</span>
              <span>${escapeHtml(item.date)}</span>
            </div>
            <a class="title-link" href="${escapeHtml(item.post_url)}" target="_blank" rel="noreferrer">${escapeHtml(item.title)}</a>
            <div class="hero-list">
              ${item.heroes.map((h, idx) => `
                <div class="hero-row ${h.sus ? 'sus' : ''}">
                  <span class="hero-name">${idx + 1}. ${escapeHtml(h.name)}${h.sus ? ' (SUS)' : ''}</span>
                  <span class="hero-debug">MSE ${h.mse} · top3: ${escapeHtml((h.top3 || []).join(', '))}</span>
                </div>
              `).join('')}
              ${item.pet ? `<div class="hero-row"><span><strong>Pet:</strong> ${escapeHtml(item.pet)}</span></div>` : ''}
            </div>
            <div class="actions">
              <button class="btn-real ${rev.status === 'real' ? 'active' : ''}" data-action="real">Real / Keep</button>
              <button class="btn-false ${rev.status === 'false' ? 'active' : ''}" data-action="false">False Positive</button>
              <input class="note-input" type="text" placeholder="Optional note (e.g. actual hero)..." value="${escapeHtml(rev.note || '')}" />
            </div>
          </div>
        `;

        card.querySelectorAll('button[data-action]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const action = btn.dataset.action;
            const cur = reviews[item.id] || {};
            if (cur.status === action) {
              delete cur.status;
            } else {
              cur.status = action;
            }
            reviews[item.id] = cur;
            saveReviews();
            render();
          });
        });

        card.querySelector('.note-input').addEventListener('change', (e) => {
          const cur = reviews[item.id] || {};
          cur.note = e.target.value;
          reviews[item.id] = cur;
          saveReviews();
        });

        list.appendChild(card);
      }
    }

    document.getElementById('heroFilter').addEventListener('change', render);
    document.getElementById('authorFilter').addEventListener('change', render);
    document.getElementById('statusFilter').addEventListener('change', render);
    document.getElementById('reprocessedOnly').addEventListener('change', render);
    document.getElementById('searchInput').addEventListener('input', render);

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const payload = ITEMS.filter(i => reviews[i.id]?.status || reviews[i.id]?.note).map(i => ({
        id: i.id,
        author: i.author,
        title: i.title,
        post_url: i.post_url,
        set_label: i.set_label,
        team_num: i.team_num,
        sus_heroes: i.sus_heroes,
        status: reviews[i.id]?.status || null,
        note: reviews[i.id]?.note || null,
      }));
      await navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
      alert(`Copied ${payload.length} reviewed items to clipboard.`);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      if (!confirm('Clear all review marks?')) return;
      reviews = {};
      saveReviews();
      render();
    });

    fetch('data.json')
      .then((r) => r.json())
      .then((data) => {
        ITEMS = data;
        populateFilters();
        render();
      });
  </script>
</body>
</html>
